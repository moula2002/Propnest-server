version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: real_estate_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: real_estate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: real_estate_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/real_estate_db?schema=public
      JWT_ACCESS_SECRET: super_production_access_jwt_key_at_least_32_characters_1234
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super_production_refresh_jwt_key_at_least_32_characters_5678
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: false
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIRECTORY: ./uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:

